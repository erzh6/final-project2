services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: students_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    depends_on:
      - db
    restart: on-failure
    environment:
      DB_URL: jdbc:postgresql://db:5432/students_db
    ports:
      - "8080:8080"